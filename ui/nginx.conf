server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS — для динамического резолва имён контейнеров
    resolver 127.0.0.11 valid=5s;

    # SPA: все пути → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # GraphQL → проксируем в API nginx
    location /graphql {
        set $backend http://nginx:80;
        proxy_pass $backend;
        proxy_set_header Host omi.local;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SSE стриминг
    location /api/chat/stream {
        set $backend http://nginx:80;
        proxy_pass $backend;
        proxy_set_header Host omi.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding on;
    }

    # GraphiQL тоже
    location /graphiql {
        set $backend http://nginx:80;
        proxy_pass $backend;
        proxy_set_header Host omi.local;
    }
}
