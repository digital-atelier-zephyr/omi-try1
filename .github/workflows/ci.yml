name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 0. Telegram: пайплайн стартовал
  notify-start:
    name: 🚀 Pipeline Started
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          MSG="${{ github.event.head_commit.message }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d parse_mode=Markdown \
            -d text="🔄 *omi-try1* pipeline started
          \`${SHORT_SHA}\` ${MSG}"

  # 1. Линтер
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        working-directory: ./api
        run: composer install --no-interaction --prefer-dist

      - name: Run Pint (Laravel linter)
        working-directory: ./api
        run: vendor/bin/pint --test

  # 2. Тесты
  test:
    name: 🧪 Tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: omi_test
          POSTGRES_USER: omi
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql

      - name: Install dependencies
        working-directory: ./api
        run: composer install --no-interaction --prefer-dist

      - name: Prepare env
        working-directory: ./api
        run: |
          cp .env.example .env
          php artisan key:generate
          cat >> .env <<EOF
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=omi_test
          DB_USERNAME=omi
          DB_PASSWORD=secret
          EOF

      - name: Run migrations
        working-directory: ./api
        run: php artisan migrate --force

      - name: Run tests
        working-directory: ./api
        run: php artisan test

  # 3. Docker build & push (API)
  docker:
    name: 🐳 Build API
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3b. Docker build & push (UI)
  docker-ui:
    name: 🐳 Build UI
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/ui
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: ./ui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3c. Docker build & push (Agent)
  docker-agent:
    name: 🐳 Build Agent
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/agent
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: ./agent
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4. Telegram notify
  notify:
    name: 📬 Notify
    needs: [lint, test, docker, docker-ui, docker-agent]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram
        run: |
          LINT="${{ needs.lint.result }}"
          TEST="${{ needs.test.result }}"
          DOCKER="${{ needs.docker.result }}"
          DOCKER_UI="${{ needs.docker-ui.result }}"
          DOCKER_AGENT="${{ needs.docker-agent.result }}"

          if [ "$LINT" = "success" ] && [ "$TEST" = "success" ]; then
            ICON="✅"
          else
            ICON="❌"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d parse_mode=Markdown \
            -d text="${ICON} *omi-try1*
          Lint: ${LINT}
          Tests: ${TEST}
          API: ${DOCKER}
          UI: ${DOCKER_UI}
          Agent: ${DOCKER_AGENT}
          Commit: \`${{ github.sha }}\`"
