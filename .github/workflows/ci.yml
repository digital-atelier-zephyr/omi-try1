name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Линтер
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        working-directory: ./api
        run: composer install --no-interaction --prefer-dist

      - name: Run Pint (Laravel linter)
        working-directory: ./api
        run: vendor/bin/pint --test

  # 2. Тесты
  test:
    name: 🧪 Tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omi_test
          POSTGRES_USER: omi
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql

      - name: Install dependencies
        working-directory: ./api
        run: composer install --no-interaction --prefer-dist

      - name: Prepare env
        working-directory: ./api
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=omi_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=omi/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=secret/' .env

      - name: Run migrations
        working-directory: ./api
        run: php artisan migrate --force

      - name: Run tests
        working-directory: ./api
        run: php artisan test

  # 3. Docker build & push
  docker:
    name: 🐳 Build & Push
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # 4. Telegram notify
  notify:
    name: 📬 Notify
    needs: [lint, test, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram
        run: |
          LINT="${{ needs.lint.result }}"
          TEST="${{ needs.test.result }}"
          DOCKER="${{ needs.docker.result }}"

          if [ "$LINT" = "success" ] && [ "$TEST" = "success" ]; then
            ICON="✅"
          else
            ICON="❌"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d parse_mode=Markdown \
            -d text="${ICON} *omi-try1*
          Lint: ${LINT}
          Tests: ${TEST}
          Docker: ${DOCKER}
          Commit: \`${{ github.sha }}\`"
