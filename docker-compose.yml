services:
  # PostgreSQL
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omi
      POSTGRES_USER: omi
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"        # 5433 на хосте, чтобы не конфликтовать
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Laravel API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - ./api:/var/www/html
    depends_on:
      - db
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: omi
      DB_USERNAME: omi
      DB_PASSWORD: secret
      OLLAMA_HOST: host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"   # доступ к Ollama на хосте

  # Nginx
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./api:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

  # DB Client (CloudBeaver)
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    ports:
      - "8081:8978"
    volumes:
      - cbdata:/opt/cloudbeaver/workspace
    depends_on:
      - db

volumes:
  pgdata:
  cbdata:
