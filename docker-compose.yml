services:
  # PostgreSQL + pgvector
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: omi
      POSTGRES_USER: omi
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U omi" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Laravel API (dev: билдит локально, монтирует код)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - ./api:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_KEY: base64:devkeydevkeydevkeydevkeydevkey12=
      APP_DEBUG: "true"
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: omi
      DB_USERNAME: omi
      DB_PASSWORD: secret
      LOG_CHANNEL: stderr
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Nginx (API)
  nginx:
    image: nginx:alpine
    ports:
      - "9080:80"
    volumes:
      - ./api:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

  # UI (Svelte SPA)
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3493:80"
    depends_on:
      - nginx

  # LiveKit голосовой агент
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}

  # DB Client
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    ports:
      - "8081:8978"
    volumes:
      - cbdata:/opt/cloudbeaver/workspace
    depends_on:
      - db

  # Логи
  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pgdata:
  cbdata:
