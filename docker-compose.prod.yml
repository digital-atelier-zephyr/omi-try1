services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omi
      POSTGRES_USER: omi
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: ghcr.io/digital-atelier-zephyr/omi-try1/api:latest
    depends_on:
      - db
    environment:
      APP_KEY: base64:placeholder_will_be_set
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: omi
      DB_USERNAME: omi
      DB_PASSWORD: secret
    volumes:
      - api_code:/var/www/html

  nginx:
    image: nginx:alpine
    ports:
      - "9080:80"
    volumes:
      - api_code:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    ports:
      - "8081:8978"
    volumes:
      - cbdata:/opt/cloudbeaver/workspace
    depends_on:
      - db

volumes:
  pgdata:
  cbdata:
  api_code:
