name: omi-prod

services:
  db:
    image: pgvector/pgvector:pg16
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/digital-atelier-zephyr/omi-try1/api:latest
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.prod
    volumes:
      - api_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 30s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  nginx:
    image: nginx:alpine
    ports:
      - "9080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--header=Host: omi.local", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    image: ghcr.io/digital-atelier-zephyr/omi-try1/ui:latest
    ports:
      - "3493:80"
    depends_on:
      - nginx
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    ports:
      - "8081:8978"
    volumes:
      - cbdata:/opt/cloudbeaver/workspace
    depends_on:
      - db

  # Веб-интерфейс для логов
  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Автодеплой: мониторит registry, сам обновляет api
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.watchtower-config.json:/config.json:ro
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - DOCKER_API_VERSION=1.40
    restart: unless-stopped

volumes:
  pgdata:
  cbdata:
  api_storage:
