name: omi-prod

services:
  db:
    image: pgvector/pgvector:pg16
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/digital-atelier-zephyr/omi-try1/api:latest
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.prod
    volumes:
      - api_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 30s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  nginx:
    image: nginx:alpine
    networks:
      - default
      - traefik
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--header=Host: omi.local", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infrastructure_default"
      - "traefik.http.routers.omi-api.rule=Host(`api.omi.local`)"
      - "traefik.http.services.omi-api.loadbalancer.server.port=80"

  ui:
    image: ghcr.io/digital-atelier-zephyr/omi-try1/ui:latest
    networks:
      - default
      - traefik
    depends_on:
      - nginx
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.docker.network=infrastructure_default"
      - "traefik.http.routers.omi-ui.rule=Host(`omi.local`)"
      - "traefik.http.services.omi-ui.loadbalancer.server.port=80"

  # LiveKit голосовой агент
  agent:
    image: ghcr.io/digital-atelier-zephyr/omi-try1/agent:latest
    env_file: .env.prod
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    networks:
      - default
      - traefik
    volumes:
      - cbdata:/opt/cloudbeaver/workspace
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infrastructure_default"
      - "traefik.http.routers.omi-cb.rule=Host(`db.omi.local`)"
      - "traefik.http.services.omi-cb.loadbalancer.server.port=8978"

  # Веб-интерфейс для логов
  dozzle:
    image: amir20/dozzle:latest
    networks:
      - default
      - traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infrastructure_default"
      - "traefik.http.routers.omi-dozzle.rule=Host(`dozzle.omi.local`)"
      - "traefik.http.services.omi-dozzle.loadbalancer.server.port=8080"

  # Observability Stack: Prometheus, Loki, Grafana, Promtail
  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/promtail/config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    networks:
      - default
      - traefik
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infrastructure_default"
      - "traefik.http.routers.omi-prometheus.rule=Host(`prometheus.omi.local`)"
      - "traefik.http.services.omi-prometheus.loadbalancer.server.port=9090"

  grafana:
    image: grafana/grafana:latest
    networks:
      - default
      - traefik
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infrastructure_default"
      - "traefik.http.routers.omi-grafana.rule=Host(`grafana.omi.local`)"
      - "traefik.http.services.omi-grafana.loadbalancer.server.port=3000"

  # Автодеплой: мониторит registry, сам обновляет api
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.watchtower-config.json:/config.json:ro
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - DOCKER_API_VERSION=1.40
    restart: unless-stopped

  # Дашборд-витрина (Homepage)
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    networks:
      - default
      - traefik
    volumes:
      - ./docker/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infrastructure_default"
      - "traefik.http.routers.omi-homepage.rule=Host(`home.omi.local`)"
      - "traefik.http.services.omi-homepage.loadbalancer.server.port=3000"
    restart: unless-stopped

networks:
  traefik:
    name: infrastructure_default
    external: true

volumes:
  pgdata:
  cbdata:
  api_storage:
  prometheus_data:
  grafana_data:
