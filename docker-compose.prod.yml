services:
  db:
    image: postgres:16-alpine
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/digital-atelier-zephyr/omi-try1/api:latest
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.prod
    volumes:
      - api_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 30s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    ports:
      - "9080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    ports:
      - "8081:8978"
    volumes:
      - cbdata:/opt/cloudbeaver/workspace
    depends_on:
      - db

volumes:
  pgdata:
  cbdata:
  api_storage:
